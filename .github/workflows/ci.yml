name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Job 1: 代码质量门禁（独立、快速）----
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  # ---- Job 2: 未签名 Release 构建（PR/手动预览用）----
  # 版本策略（2026-08-30 用户要求）：CI **不**改版本号 —— 构建直接用 version.properties
  # 当前版本；版本号只在 release 工作流（release.yml）发布时 +1 并提交（失败不提交）。
  build:
    name: Build (unsigned)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      # 未签名构建：CI 无 keystore，signingConfig 回退到 debug 签名（见 app/build.gradle.kts）。
      # 版本号直接用 version.properties 当前值（-P 显式传入，保持与 release 行为一致）。
      - name: Build release (unsigned)
        run: |
          set -euo pipefail
          VC=$(grep -oP '^versionCode=\K\d+' version.properties | head -1)
          VN=$(grep -oP '^versionName=\K.*' version.properties | head -1)
          echo "Building $VN (code $VC) — CI 不改版本号"
          ./gradlew assembleRelease --no-daemon -PversionCode="$VC" -PversionName="$VN"

      - name: Collect APKs + ABI check + mapping
        run: |
          set -euo pipefail
          mkdir -p dist/apk dist/mapping

          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            echo "::group::$apk"
            echo "ABIs:"
            unzip -Z1 "$apk" 'lib/*/*.so' | cut -d/ -f2 | sort -u
            echo "::endgroup::"
            cp -v "$apk" dist/apk/
          done

          # 收集混淆映射（release 已开 minify）。按变体目录重命名避免碰撞（借鉴 wekit）。
          find app/build/outputs/mapping -name mapping.txt -print0 | while IFS= read -r -d '' m; do
            variantDir=$(basename "$(dirname "$m")")   # e.g. release
            cp -v "$m" "dist/mapping/mapping-${variantDir}.txt"
          done || true

          echo "Collected APKs:"; ls -1 dist/apk
          echo "Collected mappings:"; ls -1 dist/mapping || echo "(none)"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: 老挂戏老叟-unsigned
          path: dist/apk/*.apk

      - name: Upload obfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: obfuscation-mapping
          path: dist/mapping/*.txt
